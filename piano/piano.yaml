    cfu: 6
    anno: 1
    stato: riconosciuto
    da: "LS 84/S Unimore: Strategie di internazionalizzazione - Strategie di investimento all'estero (4 CFU)"
  - slug: storia-pensiero-scientifico
    nome: Storia del pensiero scientifico
    ssd: M-STO/05
    ssd_2024: PHIL-02/B
    cfu: 6
    anno: 2
    stato: riconosciuto
    gruppo_scelta: "una tra Storia del pensiero economico (SECS-P/04), Storia della medicina (MED/02), Storia del pensiero scientifico (M-STO/05)"
    da: "Master FMC: Storia della scienza (6 CFU)"

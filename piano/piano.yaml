#     dell'autodichiarazione, e può riconoscere CFU diversi per eccesso o per difetto.
# ssd = SSD 2015; ssd_2024 = nuovo codice (D.M. 2024).
#
# Stati ammessi:
#   insegnamenti: riconosciuto | da_sostenere | superato
#   carenze:      da_colmare | colmata
#   test_accesso: da_sostenere | superato
# Regola: nessun cambio di stato senza una fonte (verbale, mail della segreteria,
# schermata della piattaforma), da annotare nel campo `fonte` e nel messaggio di commit.

corso: LM-78 Scienze Filosofiche Applicate
ateneo: Università Niccolò Cusano
anno_accademico: 2026/27
cfu_totali: 120
riconoscimento: provvisorio   # diventa 'deliberato' con la delibera della Giunta (annotare la fonte)

prerequisiti:
  carenze:
    - slug: filosofia-teoretica
      nome: Filosofia teoretica
      ssd: M-FIL/01
      ssd_2024: PHIL-01/A
      cfu: 9
      stato: da_colmare
      modalita: prova di idoneità libera, fuori calendario
      data: null
      fonte: riconoscimento CFU 2026/27
